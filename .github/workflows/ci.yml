name: CI QA Automation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-tests:
    name: API Newman + E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MARIADB_DATABASE: qa_automation
      MARIADB_USER: ${{ secrets.MARIADB_USER }}
      MARIADB_PASSWORD: ${{ secrets.MARIADB_PASSWORD }}
      MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Construire le backend
        working-directory: qa_automation_backend/qa_automation_backend
        run: mvn clean package -DskipTests

      - name: Valider Docker Compose
        run: docker compose -f docker-compose.ci.yml config

      - name: Construire les images Docker
        run: docker compose -f docker-compose.ci.yml build

      - name: Démarrer la stack applicative
        run: |
          docker compose -f docker-compose.ci.yml up -d mariadb backend frontend

      - name: Attendre que le backend soit opérationnel
        run: |
          echo "Attente du backend..."

          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/clients > /dev/null; then
              echo "Backend opérationnel"
              exit 0
            fi

            echo "Backend non disponible - tentative $i/30"
            sleep 5
          done

          echo "Le backend n'est pas devenu disponible à temps"
          docker compose -f docker-compose.ci.yml logs --no-color
          exit 1

      # Tests API Postman / Newman
      - name: Installer les dépendances Newman
        working-directory: postman
        run: npm ci

      - name: Exécuter les tests API Newman
        working-directory: postman
        run: npm run test:api

      # Tests E2E Playwright
      - name: Exécuter les tests E2E Playwright
        run: docker compose -f docker-compose.ci.yml run --rm tests

      - name: Afficher les logs Docker en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier les résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Arrêter et nettoyer la stack Docker
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans