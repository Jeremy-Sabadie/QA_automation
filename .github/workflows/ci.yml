name: CI QA Automation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Docker Compose + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Construire le backend
        working-directory: qa_automation_backend/qa_automation_backend
        run: mvn clean package -DskipTests

      - name: Valider Docker Compose
        run: docker compose -f docker-compose.ci.yml config

      - name: Construire et lancer la stack avec les tests
        run: |
          docker compose -f docker-compose.ci.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tests

      - name: Afficher les logs Docker en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier les résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Arrêter et nettoyer la stack Docker
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v --remove-orphans