name: QA Automation CI

on:
  push:
    branches:
      - main
      - feature/github-actions-ci

  pull_request:
    branches:
      - main

jobs:
  docker-compose-tests:
    name: Docker Compose and Playwright tests
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.ci.yml config

      - name: Build Docker images
        run: docker compose -f docker-compose.ci.yml build

      - name: Start stack and run Playwright tests
        run: |
          docker compose -f docker-compose.ci.yml up \
            --abort-on-container-exit \
            --exit-code-from tests

      - name: Display Docker logs
        if: always()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down \
            --volumes \
            --remove-orphans